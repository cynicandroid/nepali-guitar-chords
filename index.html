<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali Guitar Chords & Tabs Songbook</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e2e8f0;
            --chord-color: #d97706;
            --code-bg: #f1f5f9;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --sidebar-width: 380px;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --border-color: #334155;
            --chord-color: #fbbf24;
            --code-bg: #090d16;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar */
        aside {
            width: var(--sidebar-width);
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            cursor: pointer;
        }

        .home-nav-btn {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .home-nav-btn:hover {
            border-color: var(--primary);
        }

        .search-box {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .song-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background-color 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .song-item:hover {
            background-color: var(--code-bg);
        }

        .song-item.active {
            background-color: var(--primary);
            color: white;
        }

        .song-item.active .song-meta-info {
            color: #e0e7ff;
        }

        .song-item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .song-meta-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        /* Main Content Viewer */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .viewer-header {
            padding: 15px 30px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .song-title-area h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .song-badges {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .badge {
            background-color: var(--code-bg);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .strumming-badge-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .strumming-badge-btn:hover {
            opacity: 0.9;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--code-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn:hover {
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .transpose-group {
            display: flex;
            align-items: center;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .transpose-group button {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .transpose-group button:hover {
            background-color: var(--border-color);
        }

        .transpose-group span {
            padding: 0 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: var(--shadow);
        }

        /* Strumming Visualizer Player Panel */
        .strumming-player-panel {
            background-color: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 20px 30px;
            max-width: 900px;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }

        .strumming-player-panel.active {
            display: block;
        }

        .strumming-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .strumming-header h3 {
            font-size: 1.1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .strumming-strokes-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }

        .stroke-card {
            background: var(--code-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            width: 55px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .stroke-card.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        .stroke-icon {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stroke-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .strumming-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        /* Home Directory Styles */
        .home-hero {
            margin-bottom: 30px;
        }

        .home-hero h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .home-hero p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .alphabet-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .alphabet-btn {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .alphabet-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .directory-section {
            margin-bottom: 30px;
        }

        .directory-letter {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--border-color);
        }

        .directory-songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .directory-song-card {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .directory-song-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .directory-song-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .directory-song-capo {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        pre {
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre;
            color: var(--text-color);
            overflow-x: auto;
        }

        pre .chord {
            color: var(--chord-color);
            font-weight: 600;
        }

        /* Scroll control overlay */
        .scroll-controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            display: none;
        }

        .scroll-controls.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            aside {
                width: 100%;
                height: 35vh;
            }
            main {
                height: 65vh;
            }
            .viewer-header {
                padding: 10px 15px;
            }
            .content-container {
                padding: 15px;
            }
            .content-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <aside>
        <div class="sidebar-header">
            <h1 onclick="showHome()">🎸 Nepali Chords</h1>
            <button class="home-nav-btn" onclick="showHome()">🏠 Home</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search songs or artists...">
        </div>
        <div class="song-list" id="songList">
            <!-- Populated via JS -->
        </div>
    </aside>

    <main>
        <div class="viewer-header" id="viewerHeader" style="display: none;">
            <div class="song-title-area">
                <h2 id="songTitleDisplay">Song Title</h2>
                <div class="song-badges">
                    <span class="badge" id="badgeCapo">Capo: None</span>
                    <span class="badge" id="badgeGenre">Genre: N/A</span>
                    <span class="badge" id="badgeStrumming">
                        <span id="badgeStrummingText">Strumming: N/A</span>
                        <button class="strumming-badge-btn" id="strummingPlayBtn" onclick="toggleStrummingPlayer()">▶️ Play</button>
                    </span>
                </div>
            </div>
            <div class="toolbar">
                <div class="transpose-group" title="Transpose Chords">
                    <button onclick="transpose(-1)">-</button>
                    <span id="transposeDisplay">Key: 0</span>
                    <button onclick="transpose(1)">+</button>
                </div>
                <button class="btn" onclick="adjustFontSize(1)" title="Increase Font Size">A+</button>
                <button class="btn" onclick="adjustFontSize(-1)" title="Decrease Font Size">A-</button>
                <button class="btn" id="scrollBtn" onclick="toggleAutoScroll()" title="Auto Scroll">📜 Scroll</button>
                <button class="btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
            </div>
        </div>

        <div class="content-container" id="contentContainer">
            <!-- Loaded dynamically with Home Directory or Song Viewer -->
        </div>
    </main>

    <div class="scroll-controls" id="scrollControls">
        <span id="scrollSpeedLabel">Speed: 1x</span>
        <button class="btn" onclick="changeScrollSpeed(-1)">-</button>
        <button class="btn" onclick="changeScrollSpeed(1)">+</button>
        <button class="btn btn-primary" onclick="toggleAutoScroll()">Stop</button>
    </div>

    <script>
        let songs = [];
        let currentSongIndex = -1;
        let transposeOffset = 0;
        let currentFontSize = 0.95; // rem
        let autoScrolling = false;
        let scrollSpeed = 1;
        let scrollInterval = null;

        // Strumming player state
        let strummingPlaying = false;
        let strummingInterval = null;
        let currentStrokeIndex = 0;
        let currentStrokesList = [];
        let strumBpm = 90;

        const NOTES_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const NOTES_FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const CHORD_REGEX = /\b([A-G][#b]?(?:m|min|maj|dim|aug|sus|add|m7|maj7|7|9|11|13|add9|sus2|sus4|2|4|5|6)*(?:\/[A-G][#b]?)?)\b/g;

        async function init() {
            try {
                const response = await fetch('songs.json');
                songs = await response.json();
                renderSongList(songs);
                showHome();
            } catch (e) {
                console.error("Failed to load songs.json", e);
                document.getElementById('contentContainer').innerHTML = `
                    <div class="content-card">
                        <h3>Error loading songs</h3>
                        <p>Please make sure songs.json exists in the directory.</p>
                    </div>
                `;
            }
        }

        function renderSongList(list) {
            const container = document.getElementById('songList');
            container.innerHTML = '';
            list.forEach((song, idx) => {
                const originalIndex = songs.indexOf(song);
                const div = document.createElement('div');
                div.className = `song-item ${originalIndex === currentSongIndex && currentSongIndex !== -1 ? 'active' : ''}`;
                div.onclick = () => selectSong(originalIndex);
                div.innerHTML = `
                    <div class="song-item-title">${song.title}</div>
                    <div class="song-meta-info">
                        <span>🎸 ${song.capo || 'No Capo'}</span>
                        <span>🎵 ${song.genre || 'Music'}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        document.getElementById('searchInput').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = songs.filter(s => 
                s.title.toLowerCase().includes(term) || 
                (s.genre && s.genre.toLowerCase().includes(term)) ||
                (s.capo && s.capo.toLowerCase().includes(term))
            );
            renderSongList(filtered);
        };

        function showHome() {
            currentSongIndex = -1;
            stopStrummingPlayer();
            document.getElementById('viewerHeader').style.display = 'none';
            
            document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
            if (autoScrolling) toggleAutoScroll();

            const letters = sortedLetters();
            let alphabetHtml = letters.map(let => `<a href="#letter-${let}" class="alphabet-btn">${let}</a>`).join('');
            
            let sectionsHtml = '';
            letters.forEach(letter => {
                const letterSongs = songs.filter(s => {
                    const first = s.title ? s.title[0].toUpperCase() : '#';
                    const key = first.match(/[A-Z]/) ? first : '#';
                    return key === letter;
                });

                if (letterSongs.length > 0) {
                    let songCards = letterSongs.map(s => {
                        const origIdx = songs.indexOf(s);
                        const capoText = s.capo && s.capo.toLowerCase() !== 'none' ? `Capo: ${s.capo}` : '';
                        return `
                            <div class="directory-song-card" onclick="selectSong(${origIdx})">
                                <div class="directory-song-title">${s.title}</div>
                                ${capoText ? `<div class="directory-song-capo">🎸 ${capoText}</div>` : ''}
                            </div>
                        `;
                    }).join('');

                    sectionsHtml += `
                        <div class="directory-section" id="letter-${letter}">
                            <div class="directory-letter">${letter}</div>
                            <div class="directory-songs-grid">
                                ${songCards}
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('contentContainer').innerHTML = `
                <div class="content-card" style="max-width: 1000px;">
                    <div class="home-hero">
                        <h1>🎶 Nepali Guitar Chords & Tabs Collection 🎸</h1>
                        <p>Welcome to the digital songbook containing chords and lyrics for over 200+ popular Nepali, Hindi, and English songs. Click any song below or search in the sidebar to view chords, transpose keys, and auto-scroll.</p>
                    </div>
                    <div class="alphabet-nav">
                        ${alphabetHtml}
                    </div>
                    <div class="directory-container">
                        ${sectionsHtml}
                    </div>
                </div>
            `;
            document.getElementById('contentContainer').scrollTop = 0;
        }

        function sortedLetters() {
            const setLetters = new Set();
            songs.forEach(s => {
                const first = s.title ? s.title[0].toUpperCase() : '#';
                const key = first.match(/[A-Z]/) ? first : '#';
                setLetters.add(key);
            });
            return Array.from(setLetters).sort((a, b) => {
                if (a === '#') return 1;
                if (b === '#') return -1;
                return a.localeCompare(b);
            });
        }

        function selectSong(index) {
            currentSongIndex = index;
            transposeOffset = 0;
            stopStrummingPlayer();
            document.getElementById('transposeDisplay').innerText = `Key: 0`;
            document.getElementById('viewerHeader').style.display = 'flex';
            
            const items = document.querySelectorAll('.song-item');
            items.forEach((item, idx) => {
                const origIdx = songs.indexOf(songs[idx]);
                item.classList.toggle('active', origIdx === currentSongIndex);
            });

            renderCurrentSong();
            
            const container = document.getElementById('contentContainer');
            container.scrollTop = 0;
            if (autoScrolling) toggleAutoScroll();
        }

        function renderCurrentSong() {
            if (currentSongIndex < 0 || currentSongIndex >= songs.length) return;
            const song = songs[currentSongIndex];

            document.getElementById('songTitleDisplay').innerText = song.title;
            document.getElementById('badgeCapo').innerText = `Capo: ${song.capo || 'None'}`;
            document.getElementById('badgeGenre').innerText = `Genre: ${song.genre || 'N/A'}`;
            document.getElementById('badgeStrummingText').innerText = `Strumming: ${song.strumming || 'N/A'}`;

            // Hide/show play button depending on whether strumming is available
            const playBtn = document.getElementById('strummingPlayBtn');
            if (!song.strumming || song.strumming.toLowerCase() === 'n/a') {
                playBtn.style.display = 'none';
            } else {
                playBtn.style.display = 'inline-flex';
            }

            let htmlContent = '';
            song.lines.forEach(lineObj => {
                let text = lineObj.text;
                text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                
                if (lineObj.is_chord) {
                    text = text.replace(CHORD_REGEX, (match) => {
                        const transposed = transposeChord(match, transposeOffset);
                        return `<span class="chord">${transposed}</span>`;
                    });
                }
                htmlContent += text + '\n';
            });

            document.getElementById('contentContainer').innerHTML = `
                <div class="strumming-player-panel" id="strummingPlayerPanel">
                    <div class="strumming-header">
                        <h3>🎸 Strumming Pattern Visualizer: <span id="strumPatternTitle">${song.strumming || ''}</span></h3>
                        <button class="btn" onclick="toggleStrummingPlayer()">✕ Close</button>
                    </div>
                    <div class="strumming-strokes-row" id="strokesRow">
                        <!-- Populated dynamically -->
                    </div>
                    <div class="strumming-controls">
                        <button class="btn btn-primary" id="strumPlayPauseBtn" onclick="toggleStrummingPlayback()">▶️ Play Rhythm</button>
                        <button class="btn" onclick="adjustStrumBpm(-10)">🐢 Slower</button>
                        <span id="strumBpmLabel" style="font-weight: 600; font-size: 0.9rem;">90 BPM</span>
                        <button class="btn" onclick="adjustStrumBpm(10)">🐇 Faster</button>
                    </div>
                </div>
                <div class="content-card">
                    <pre id="songPre" style="font-size: ${currentFontSize}rem;">${htmlContent}</pre>
                </div>
            `;
        }

        // Strumming Player Logic
        function toggleStrummingPlayer() {
            const panel = document.getElementById('strummingPlayerPanel');
            if (!panel) return;
            
            const isOpen = panel.classList.toggle('active');
            if (isOpen) {
                buildStrokesCards();
            } else {
                stopStrummingPlayer();
            }
        }

        function parseStrummingStrokes(strumStr) {
            if (!strumStr) return [];
            let strokes = [];
            // Clean up special notes in brackets like [Reggee], (slur)
            let cleaned = strumStr.replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '').toUpperCase();
            
            for (let i = 0; i < cleaned.length; i++) {
                let ch = cleaned[i];
                if (ch === 'D' || ch === 'U' || ch === 'M' || ch === 'S' || ch === 'X') {
                    strokes.push(ch);
                } else if (ch === ' ') {
                    // Optional rest or spacing
                }
            }
            if (strokes.length === 0) {
                // Fallback default
                strokes = ['D', 'D', 'U', 'U', 'D', 'U'];
            }
            return strokes;
        }

        function buildStrokesCards() {
            if (currentSongIndex < 0) return;
            const song = songs[currentSongIndex];
            currentStrokesList = parseStrummingStrokes(song.strumming);
            
            const row = document.getElementById('strokesRow');
            if (!row) return;

            row.innerHTML = currentStrokesList.map((stroke, idx) => {
                let icon = '↓';
                let label = 'Down';
                if (stroke === 'U') { icon = '↑'; label = 'Up'; }
                else if (stroke === 'M' || stroke === 'X') { icon = '✖'; label = 'Mute'; }
                else if (stroke === 'S') { icon = '✋'; label = 'Slap'; }

                return `
                    <div class="stroke-card" id="stroke-${idx}">
                        <div class="stroke-icon">${icon}</div>
                        <div class="stroke-label">${label}</div>
                    </div>
                `;
            }).join('');
        }

        function toggleStrummingPlayback() {
            strummingPlaying = !strummingPlaying;
            const btn = document.getElementById('strumPlayPauseBtn');
            
            if (strummingPlaying) {
                if (btn) btn.innerText = '⏸️ Pause';
                if (currentStrokesList.length === 0) buildStrokesCards();
                
                currentStrokeIndex = 0;
                highlightStroke(currentStrokeIndex);
                
                // Interval calculation based on BPM (4 beats per cycle or per stroke)
                let intervalMs = Math.round(60000 / strumBpm / 2); // 8th note spacing
                strummingInterval = setInterval(() => {
                    currentStrokeIndex = (currentStrokeIndex + 1) % currentStrokesList.length;
                    highlightStroke(currentStrokeIndex);
                }, intervalMs);
            } else {
                stopStrummingPlayer();
            }
        }

        function highlightStroke(index) {
            document.querySelectorAll('.stroke-card').forEach((card, idx) => {
                card.classList.toggle('active', idx === index);
            });
        }

        function stopStrummingPlayer() {
            strummingPlaying = false;
            clearInterval(strummingInterval);
            const btn = document.getElementById('strumPlayPauseBtn');
            if (btn) btn.innerText = '▶️ Play Rhythm';
            document.querySelectorAll('.stroke-card').forEach(card => card.classList.remove('active'));
        }

        function adjustStrumBpm(delta) {
            strumBpm = Math.max(40, Math.min(200, strumBpm + delta));
            document.getElementById('strumBpmLabel').innerText = `${strumBpm} BPM`;
            if (strummingPlaying) {
                // Restart interval with new BPM
                clearInterval(strummingInterval);
                let intervalMs = Math.round(60000 / strumBpm / 2);
                strummingInterval = setInterval(() => {
                    currentStrokeIndex = (currentStrokeIndex + 1) % currentStrokesList.length;
                    highlightStroke(currentStrokeIndex);
                }, intervalMs);
            }
        }

        function transposeChord(chordStr, semitones) {
            if (semitones === 0) return chordStr;
            
            if (chordStr.includes('/')) {
                const parts = chordStr.split('/');
                return transposeChord(parts[0], semitones) + '/' + transposeChord(parts[1], semitones);
            }

            const match = chordStr.match(/^([A-G][#b]?)(.*)$/);
            if (!match) return chordStr;

            const root = match[1];
            const suffix = match[2];

            let noteList = root.includes('b') ? NOTES_FLAT : NOTES_SHARP;
            let index = noteList.indexOf(root);
            if (index === -1) {
                index = NOTES_SHARP.indexOf(root);
                noteList = NOTES_SHARP;
            }
            if (index === -1) return chordStr;

            let newIndex = (index + semitones) % 12;
            if (newIndex < 0) newIndex += 12;

            return noteList[newIndex] + suffix;
        }

        function transpose(semitones) {
            transposeOffset += semitones;
            document.getElementById('transposeDisplay').innerText = `Key: ${transposeOffset > 0 ? '+' + transposeOffset : transposeOffset}`;
            renderCurrentSong();
        }

        function adjustFontSize(delta) {
            currentFontSize = Math.max(0.75, Math.min(1.5, currentFontSize + (delta * 0.1)));
            const pre = document.getElementById('songPre');
            if (pre) pre.style.fontSize = `${currentFontSize}rem`;
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        function toggleAutoScroll() {
            autoScrolling = !autoScrolling;
            const controls = document.getElementById('scrollControls');
            const container = document.getElementById('contentContainer');
            
            const btn = document.getElementById('scrollBtn');
            if (autoScrolling) {
                controls.classList.add('active');
                if (btn) btn.classList.add('btn-primary');
                scrollInterval = setInterval(() => {
                    container.scrollTop += scrollSpeed;
                    if (container.scrollTop + container.clientHeight >= container.scrollHeight) {
                        toggleAutoScroll();
                    }
                }, 50);
            } else {
                controls.classList.remove('active');
                if (btn) btn.classList.remove('btn-primary');
                clearInterval(scrollInterval);
            }
        }

        function changeScrollSpeed(delta) {
            scrollSpeed = Math.max(1, Math.min(10, scrollSpeed + delta));
            document.getElementById('scrollSpeedLabel').innerText = `Speed: ${scrollSpeed}x`;
        }

        window.onload = init;
    </script>
</body>
</html>
