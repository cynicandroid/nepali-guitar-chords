<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali Guitar Chords</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Sample-based acoustic steel-string guitar and WebAudioFont strumming engine. -->
    <script src="assets/webaudiofont/WebAudioFontPlayer.js"></script>
    <script src="assets/webaudiofont/0250_SoundBlasterOld_sf2.js"></script>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body data-theme="dark">

    <aside>
        <div class="sidebar-header">
            <h1 onclick="showHome()">Nepali Chords</h1>
            <div class="sidebar-nav-actions">
                <button class="home-nav-btn" onclick="showHome()" title="Go to home">🏠 Home</button>
                <button class="home-nav-btn" onclick="showHelp()" title="Open guitar chord help">❔ Help</button>
                <button class="home-nav-btn install-nav-btn" id="installBtn" onclick="installApp()" title="Install Nepali Chords" hidden>⬇ Install</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search Songs. Filter by Genre or Capo fret">
        </div>
        <div class="song-list" id="songList">
            <!-- Populated via JS -->
        </div>
    </aside>

    <main>
        <div class="viewer-header" id="viewerHeader" style="display: none;">
            <div class="song-title-area">
                <h2 id="songTitleDisplay">Song Title</h2>
                <div class="song-badges">
                    <span class="badge" id="badgeCapo">Capo: None</span>
                    <span class="badge" id="badgeGenre">Genre: N/A</span>
                    <span class="badge" id="badgeStrumming">
                        <span id="badgeStrummingText">Strumming: N/A</span>
                        <button class="strumming-badge-btn" id="strummingPlayBtn" onclick="toggleStrummingPlayer()">▶️ Play</button>
                    </span>
                </div>
            </div>
            <div class="toolbar">
                <div class="transpose-group" title="Transpose Chords">
                    <button onclick="transpose(-1)">-</button>
                    <span id="transposeDisplay">Key: 0</span>
                    <button onclick="transpose(1)">+</button>
                </div>
                <button class="btn" onclick="adjustFontSize(1)" title="Increase Font Size">A+</button>
                <button class="btn" onclick="adjustFontSize(-1)" title="Decrease Font Size">A-</button>
                <button class="btn" id="scrollBtn" onclick="toggleAutoScroll()" title="Auto Scroll">📜 Scroll</button>
                <button class="btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
            </div>
        </div>

        <div class="content-container" id="contentContainer">
            <!-- Loaded dynamically with Home Directory or Song Viewer -->
        </div>
    </main>

    <div class="scroll-controls" id="scrollControls">
        <span id="scrollSpeedLabel">Speed: 1x</span>
        <button class="btn" onclick="changeScrollSpeed(-1)">-</button>
        <button class="btn" onclick="changeScrollSpeed(1)">+</button>
        <button class="btn btn-primary" id="scrollPlayPauseBtn" onclick="toggleScrollPlayback()" title="Pause auto scroll">⏸</button>
    </div>

    <script src="src/app.js"></script>
</body>
</html>
